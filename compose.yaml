name: weave

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    restart: unless-stopped
    network_mode: host
    user: "${WEAVE_UID:?Set WEAVE_UID}:${WEAVE_GID:?Set WEAVE_GID}"
    working_dir: "${WEAVE_REPO_ROOT:?Set WEAVE_REPO_ROOT}"
    environment:
      HOME: "${WEAVE_HOST_HOME:?Set WEAVE_HOST_HOME}"
      CODEX_HOME: "${WEAVE_HOST_HOME}/.codex"
      PATH: /opt/codex-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      WEAVE_WEB_HOST: "127.0.0.1"
      WEAVE_WEB_PORT: "3444"
      WEAVE_API_PORT: "4317"
    volumes:
      - "${WEAVE_REPO_ROOT}:${WEAVE_REPO_ROOT}"
      - "${WEAVE_HOST_HOME}/.codex:${WEAVE_HOST_HOME}/.codex"
      - type: bind
        source: "${WEAVE_HOST_HOME}/.local/state/weave"
        target: "${WEAVE_HOST_HOME}/.local/state/weave"
        bind:
          create_host_path: false
      - "${WEAVE_NODE_ROOT:?Set WEAVE_NODE_ROOT}:/opt/codex-runtime:ro"
    command: ["npm", "run", "dev"]
